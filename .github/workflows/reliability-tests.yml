name: Radar reliability tests

on:
  pull_request:
    paths:
      - '.github/workflows/radar.yml'
      - '.github/workflows/reliability-tests.yml'
      - 'scripts/**'
      - 'test/**'
      - 'radar.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/*.test.cjs
